# Hungarian translations
# camelCase kulcsok, a frontend TypeScript union type generálódik belőlük
# (Maven code generator plugin: backend/build-tools/generate-i18n-keys/)
#
# Kategóriák:
# - validation: form mező validáció
# - auth: bejelentkezés, jelszó, jogosultság
# - resource: resource not found, internal error
# - crud: create, update, delete sikeres műveletek
# - role: role hierarchy errors

# ===== Validation =====
validation.notBlank=A mező nem lehet üres
validation.email=Érvényes email címet adjon meg
validation.minLength=Minimum {{min}} karakter
validation.maxLength=Maximum {{max}} karakter
validation.size.max=A mező túl hosszú (max {{max}} karakter)
validationError=Validációs hiba

# ===== Authentication & Authorization =====
