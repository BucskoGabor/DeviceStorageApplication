spring:
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

otel:
  exporter:
    otlp:
      endpoint: ""

logging:
  level:
    root: DEBUG
    hu.tanszek: TRACE

# Dev környezetben a refresh token cookie-t HTTP-n is elfogadjuk (nincs HTTPS terminálás),
# és a belső hibaüzenetek megjelennek a kliens felé a kényelmes debuggoláshoz.
jwt:
  cookie-secure: false
server:
  error:
    include-message: always
    include-binding-errors: always