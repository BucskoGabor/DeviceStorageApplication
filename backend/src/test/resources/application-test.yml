spring:
  application:
    name: device-storage-test
  mail:
    host: localhost
    port: 1025
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    repair-on-migrate: false

# Override the broken dev default: 32-byte base64-encoded key (TEST ONLY).
crypto:
  aes-key: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=

server:
  port: 0  # Random port a teszt idejére

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

logging:
  level:
    root: INFO
    hu.tanszek: DEBUG
