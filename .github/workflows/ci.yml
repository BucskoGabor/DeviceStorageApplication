name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ===== Backend =====
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Code formatting (Spotless)
        working-directory: backend
        run: mvn spotless:check -B -q

      - name: Lint (Checkstyle)
        working-directory: backend
        run: mvn checkstyle:check -B -q

      - name: OWASP Dependency-Check
        working-directory: backend
        if: ${{ env.NVD_API_KEY != '' }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn org.owasp:dependency-check-maven:check -B -q -DnvdApiKey=$NVD_API_KEY
        continue-on-error: true

      - name: Unit tests + Coverage
        working-directory: backend
        run: mvn test -B -q

      - name: Integration tests (Testcontainers, needs Docker)
        working-directory: backend
        run: mvn verify -B -q

      - name: Build Docker image
        working-directory: backend
        run: docker build -t device-storage-backend:test .

  # ===== Frontend =====
  frontend:
    name: Frontend (Node 20 + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Format check (Prettier)
        working-directory: frontend
        run: npx prettier --check 'src/**/*.{ts,tsx,css}'

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Build Docker image
        working-directory: frontend
        run: docker build -t device-storage-frontend:test .

  # ===== Integration smoke test =====
  smoke-test:
    name: Smoke test (docker-compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .env files
        run: |
          cp .env.example .env
          cp backup.env.example backup.env
          ./scripts/bootstrap.sh

      - name: Start docker-compose
        run: docker compose --profile dev up -d

      - name: Wait for services
        run: sleep 60

      - name: Run smoke test
        run: ./scripts/smoke-test.sh
        continue-on-error: true  # Most egyes endpoint-ok még nincsenek implementálva

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop docker-compose
        if: always()
        run: docker compose down
